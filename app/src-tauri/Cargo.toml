[package]
name = "cse_under_box"
version = "0.1.0"
description = "CSE Under Box cross-platform undergraduate CSE learning system"
authors = ["Sheikh Sohel Moon"]
edition = "2021"

[lib]
name = "cse_under_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
